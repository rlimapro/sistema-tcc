[project]
name = "sarc"
version = "3.0.0"
description = "SARC-CE v3: grafo de conhecimento para indícios de conluio, aditivação e preterição em contratações públicas dos municípios do Ceará"
requires-python = ">=3.13,<3.14"
dependencies = [
    "click==8.5.0",
    "mcp==2.3.0",
    "neo4j==6.3.0",
    "psycopg[binary]==3.3.6",
    "python-dotenv==1.2.3",
    "requests==2.34.2",
]

[project.scripts]
sarc = "sarc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sarc", "benchmark"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: precisa de um Neo4j de teste (docker compose --profile teste up -d neo4j-teste)",
]
addopts = "-ra"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.2",
]
